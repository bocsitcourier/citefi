name: Deploy to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      ssh_verify_only:
        description: Verify the pinned host key only (no deployment or migrations)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify-ssh:
    name: Verify pinned SSH host key
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed host verification
        run: bash tests/deployment/ssh-host-key.test.sh
      - name: Verify production ED25519 pin
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_HOST_FINGERPRINT: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}
          KNOWN_HOSTS_FILE: ${{ runner.temp }}/ssh-pin/known_hosts
        run: |
          scripts/verify-ssh-host-key.sh
          echo "Production ED25519 host pin verified." >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm a mismatched production pin is rejected
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_HOST_FINGERPRINT: SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          KNOWN_HOSTS_FILE: ${{ runner.temp }}/ssh-pin/rejected
        run: |
          if scripts/verify-ssh-host-key.sh 2>"$RUNNER_TEMP/ssh-pin/rejection.log"; then
            echo "ERROR: mismatched pin was accepted." >&2
            exit 1
          fi
          grep -q 'SSH host fingerprint mismatch' "$RUNNER_TEMP/ssh-pin/rejection.log"
          test ! -e "$KNOWN_HOSTS_FILE"
          echo "Mismatched host pin rejected before SSH/SCP." >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate release
    needs: verify-ssh
    if: ${{ !inputs.ssh_verify_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch lockfile registry
        run: sed -i -E 's|https?://package-firewall\.replit\.(local|internal)/npm|https://registry.npmjs.org|g' package-lock.json
      - run: npm ci --registry https://registry.npmjs.org
      - run: npm run validate:release
      - run: npm run build

  deploy:
    name: SSH deploy to droplet
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Deploy with shared release runner
        env:
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_SSH_HOST_FINGERPRINT: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: citefi
          DO_APP_DIR: /var/www/citefi
          DO_BRANCH: main
          DO_PM2_CONFIG: ecosystem.config.cjs
          DO_HEALTHCHECK_URL: http://127.0.0.1:5000/api/health?full=1
          DO_PUBLIC_HEALTHCHECK_URL: ${{ vars.DO_PUBLIC_HEALTHCHECK_URL }}
          DO_VALIDATION_COMMAND: npm run validate:release
        run: |
          expiry="$(($(date +%s) + 300))"
          export PRODUCTION_DEPLOY_CONFIRMATION="DEPLOY_CITEFI_PRODUCTION_UNTIL_${expiry}"
          scripts/deploy-to-do.sh
