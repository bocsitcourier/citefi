name: Deploy to DigitalOcean

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch lockfile registry
        run: sed -i 's|http://package-firewall\.replit\.local/npm|https://registry.npmjs.org|g' package-lock.json
      - run: npm ci --registry https://registry.npmjs.org
      - run: npm run validate:release
      - run: npm run build

  deploy:
    name: SSH deploy to droplet
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with shared release runner
        env:
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: citefi
          DO_APP_DIR: /var/www/citefi
          DO_BRANCH: main
          DO_PM2_CONFIG: ecosystem.config.cjs
          DO_HEALTHCHECK_URL: http://127.0.0.1:5000/api/health?full=1
          DO_VALIDATION_COMMAND: npm run validate:release
        run: scripts/deploy-to-do.sh
