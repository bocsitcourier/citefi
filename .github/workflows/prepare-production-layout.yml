name: Prepare preserved production release layout

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect only, or explicitly approved preservation of the legacy build
        type: choice
        options: [inspect, prepare]
        default: inspect
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  layout:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check preservation contract without production access
        run: python3 tests/deployment/production-layout.test.py
      - name: Inspect or preserve using pinned service-account SSH
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_HOST_FINGERPRINT: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          PRODUCTION_LAYOUT_OPERATION: ${{ inputs.operation }}
        run: bash scripts/recovery/production-layout.sh
