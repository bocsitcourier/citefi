name: Remove two approved failed deployment artifacts

on:
  workflow_dispatch:
    inputs:
      confirmation:
        type: string
        required: true
        description: Enter REMOVE-7dd7fe00-FAILED-ARTIFACTS for the approved one-time cleanup

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.confirmation == 'REMOVE-7dd7fe00-FAILED-ARTIFACTS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test exact cleanup scope and SSH pin without host access
        run: |
          python3 -B tests/deployment/cleanup-failed-release.test.py
          bash tests/deployment/ssh-host-key.test.sh
      - name: Revalidate evidence and remove only the authorized artifacts
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_HOST_FINGERPRINT: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          source scripts/recovery/ssh-session.sh
          "${SSH[@]:0:${#SSH[@]}-1}" -T -o ClearAllForwardings=yes -o ForwardAgent=no \
            "root@${DO_HOST}" 'python3 -B - --privileged-verification' \
            < scripts/recovery/cleanup-failed-7dd7fe00.py
