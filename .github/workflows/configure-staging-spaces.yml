name: Configure staging Spaces only

on:
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: Configure citefi/nyc3 for staging/synthetic only; no uploads or restarts
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  configure:
    if: ${{ inputs.confirm_staging_only && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check bucket access and save staging-only configuration
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_SSH_HOST_FINGERPRINT: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}
          DO_USER: citefi
        run: bash scripts/configure-staging-spaces.sh
