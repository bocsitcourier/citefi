name: Scoped production backup recovery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Approved system team and backup preparation, or isolated restore verification
        type: choice
        options:
          - prepare-backup
          - verify-restore
          - inspect-release
          - stage-application
        required: true
  schedule:
    - cron: "15 8 * * 0"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate scoped tooling and SSH pin contract
        run: |
          python3 tests/deployment/production-recovery.test.py
          bash tests/deployment/ssh-host-key.test.sh
      - uses: actions/setup-node@v4
        if: inputs.operation == 'stage-application'
        with:
          node-version: 22
          cache: npm
      - name: Install and validate current release
        if: inputs.operation == 'stage-application'
        run: |
          sed -i 's|http://package-firewall\.replit\.local/npm|https://registry.npmjs.org|g' package-lock.json
          npm ci --registry https://registry.npmjs.org
          npm run validate:release
      - name: Build off-host without production credentials
        if: inputs.operation == 'stage-application'
        env:
          DATABASE_URL: postgresql://build_only:build_only@127.0.0.1:1/build_only
          JWT_SECRET: build-only-not-a-production-secret
          OPENAI_API_KEY: build-only-not-a-production-key
          GEMINI_API_KEY: build-only-not-a-production-key
        run: |
          npm run build
          npx --no-install drizzle-kit export --schema=./shared/schema.ts --dialect=postgresql > .recovery-schema.sql
      - name: Prepare isolated PostgreSQL 16 verifier
        if: inputs.operation == 'verify-restore' || github.event_name == 'schedule'
        run: |
          sudo systemctl start postgresql
          psql --version | grep -E ' 16\.'
          sudo -u postgres createuser --superuser "$USER"
          createdb citefi_restore_verify
      - name: Apply only the explicitly approved operation
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_HOST_FINGERPRINT: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          OPERATION: ${{ inputs.operation || 'verify-restore' }}
        run: |
          case "$OPERATION" in
            prepare-backup) bash scripts/recovery/prepare-backup.sh ;;
            verify-restore) bash scripts/recovery/verify-restore.sh ;;
            inspect-release) bash scripts/recovery/inspect-release.sh ;;
            stage-application) bash scripts/recovery/stage-application.sh ;;
            *) echo "Unapproved operation"; exit 1 ;;
          esac
