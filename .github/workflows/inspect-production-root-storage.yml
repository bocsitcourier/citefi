name: Read-only production root disk breakdown

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Read-only report scope
        type: choice
        options: [filesystem, logs, storage-categories]
        default: filesystem

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify host pin contract and disk report without production access
        run: |
          bash tests/deployment/ssh-host-key.test.sh
          python3 -B tests/deployment/digitalocean-disk-breakdown.test.py
      - name: Measure only fixed disk-usage categories over pinned SSH
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_HOST_FINGERPRINT: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DISK_SCOPE: ${{ inputs.scope }}
        run: |
          source scripts/recovery/ssh-session.sh
          case "$DISK_SCOPE" in
            filesystem) command='nice -n 15 ionice -c 3 python3 -B -' ;;
            logs) command='nice -n 15 ionice -c 3 python3 -B - --logs' ;;
            storage-categories) command='nice -n 15 ionice -c 3 python3 -B - --storage-categories' ;;
            *) exit 1 ;;
          esac
          "${SSH[@]:0:${#SSH[@]}-1}" -T -o ClearAllForwardings=yes -o ForwardAgent=no \
            "root@${DO_HOST}" "$command" \
            < scripts/recovery/digitalocean-disk-breakdown.py
