name: Manage isolated staging publishing server

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect, set up, or verify isolated staging publishing
        type: choice
        options: [inspect, inspect-root, setup, verify]
        required: true
        default: inspect

permissions:
  contents: read

jobs:
  staging:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Operate only the isolated staging publishing setup
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_SSH_HOST_FINGERPRINT: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}
          DO_USER: citefi
          STAGING_OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
          STAGING_SOURCE_BLOB: 71cf753a62551dd56f1a392941c0ff12214e199e
          STAGING_SOURCE_SHA256: 6cb3fbdda254edec7f448e3407561ef7017527b5822ca6000f2df4c485869c50
        run: bash scripts/staging-publishing-server.sh
