name: Manage isolated staging publishing server

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect, set up, or verify isolated staging publishing
        type: choice
        options: [inspect, inspect-root, setup, verify]
        required: true
        default: inspect

permissions:
  contents: read

jobs:
  staging:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Operate only the isolated staging publishing setup
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_SSH_HOST_FINGERPRINT: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}
          DO_USER: citefi
          STAGING_OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
          STAGING_SOURCE_BLOB: ce104c5fc2218f492c84b856c66f41b9c759d8fb
          STAGING_SOURCE_SHA256: e2ed5cef3925d8de5a1cd4b2125cb2cade23564e31bba76b5339a410100afba7
        run: bash scripts/staging-publishing-server.sh
