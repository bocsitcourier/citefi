name: Manage isolated staging publishing server

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect, set up, or verify isolated staging publishing
        type: choice
        options: [inspect, setup, verify]
        required: true
        default: inspect

permissions:
  contents: read

jobs:
  staging:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Operate only the isolated staging publishing setup
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_SSH_HOST_FINGERPRINT: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}
          DO_USER: citefi
          STAGING_OPERATION: ${{ inputs.operation }}
        run: bash scripts/staging-publishing-server.sh
